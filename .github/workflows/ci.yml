name: CI

on:
  push:
    branches: [main, next2]
  pull_request:

# Only PR runs share a group; every other run gets its own so none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  test:
    name: Spec source and Carve 0.2 samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # spec docs the drift guard reads

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
      - run: npm run spec:check

      - uses: actions/checkout@v7
        with:
          repository: markup-carve/carve-js
          ref: 0ad3b847aafd6c92bf8d83ae116e1107a4f5b122
          path: carve-js-next2
      - run: npm ci && npm run build
        working-directory: carve-js-next2
      - run: npm run samples:check
        env:
          CARVE2_CLI: ${{ github.workspace }}/carve-js-next2/dist/cli2.js
