name: Spec drift

# The `spec` submodule is a pin, and the drift guard in test/drift.test.mjs reads
# the PINNED copy - so it catches "the skill fell behind its pin" and can never
# catch "the pin fell behind the spec". A check that reads its own frozen input
# cannot see that input move (#4). This job is the other half: it reads carve
# main.
#
# What is reported and what fails:
#
# - Commit lag is REPORTED, not gated. The skill's prose, its spec pin and its
#   engine have to move together, and the engine cannot move past a published
#   carve-js. Failing on lag alone would go red for something this repo cannot
#   fix by itself.
# - A CHANGED WATCHED ENTRY files a ticket. One ledger per watched document
#   records which text the skill was last read against - per numbered section of
#   docs/divergence-from-djot.md, per node definition of resources/ast-schema.json,
#   per row of docs/cheatsheet.md, or per preamble/H2/H3 section of a topic
#   source; when one of those moves at carve main, the
#   offline guard's green stops meaning anything, and no other check in this repo
#   can tell. That is fixable here: bump the pin, re-read what is named against
#   the reference pages, and record the review.
#
# Not hypothetical, twice. carve#455 inverted the whole container rule inside
# section 13 without changing a heading number, the pin bump carried it in (#6),
# and every check stayed green while the trap topic guides described the old
# rule. Then the `image` node's block-position rule was rewritten in
# resources/ast-schema.json across pin be6e7cc6 -> cc06bb5 and every check stayed
# green again, because the guard named prose documents only (#84). And
# docs/cheatsheet.md, which the guard DID name, was read only for whether certain
# tokens were present, so a row could be rewritten around a surviving token with
# nothing to report it (#89). Then the spec grew a normative rule registry and
# six generated views over it, none of them named, and CARVE-P0-020 - the rule
# deciding which container owns a line between two open content columns, which
# the block/container guide's trap 11 teaches - arrived with every gate green (#98).
#
# check-spec-review.mjs also re-checks, against THIS fresh checkout, that the
# clause inventory and the generated views still hold what the rules registry
# holds. That question is about the spec as it stands, not about the pin, so the
# offline run over the pinned copy cannot answer it.

# A drift verdict files or updates ONE tracking issue and the run stays green:
# upstream moving is work for a person, not a defect of this repo (ruling 1 of
# markup-carve/carve#2706). A check that could not do its job, or a reporter
# that could not file, still ends the run red.

on:
  schedule:
    # 05:00 UTC daily, after the spec has had a night to settle.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  spec-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the spec
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: carve-spec
          fetch-depth: 0

      - name: Compare the spec submodule against carve main
        run: |
          set -euo pipefail
          rev="$(git rev-parse HEAD:spec)"
          if ! git -C carve-spec cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::the spec submodule pins ${rev}, which is not a commit in markup-carve/carve"
            exit 1
          fi
          if ! git -C carve-spec merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::spec ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C carve-spec rev-list --count "${rev}..origin/main")"
          corpus="$(git -C carve-spec ls-tree -r --name-only "${rev}" tests/corpus | grep -c '\.crv$' || true)"
          latest="$(git -C carve-spec ls-tree -r --name-only origin/main tests/corpus | grep -c '\.crv$' || true)"
          echo "spec pin: ${rev} ($(git -C carve-spec log -1 --format=%s "${rev}"))"
          echo "carve main is ${behind} commit(s) ahead; corpus ${corpus} -> ${latest} documents"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the spec submodule is ${behind} commit(s) behind carve main (corpus ${corpus} vs ${latest})"
          fi

      # The same comparison `npm test` runs against the pinned copy, pointed at
      # carve main instead. It takes the CHECKOUT, not one document, so it covers
      # every ledger in scripts/review-ledgers.mjs - adding a watched document
      # does not need this step edited. Deliberately NOT `continue-on-error`:
      # this is the one condition nothing else in this repo can observe.
      # Exit 3 is the drift verdict; any other nonzero exit is a broken check.
      - name: Has a watched spec document moved since the skill was read?
        id: review
        run: |
          set +e -u
          node scripts/check-spec-review.mjs carve-spec 2>&1 | sed 's#carve-spec/##' | tee /tmp/spec-review.txt
          status="${PIPESTATUS[0]}"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0) ;;
            3) echo "::warning::a watched spec document changed at carve main; the skill has not been read against it" ;;
            *) echo "::error::check-spec-review.mjs exited $status, so it could not compare the ledgers"; exit 1 ;;
          esac

      # The spec pin and the ENGINE are two different pins, and both can fall
      # behind. Nothing in this repository could observe the second one: the
      # lockfile held `@markup-carve/carve` 0.1.3 while package.json allowed
      # 0.1.4, references/capabilities.json named 0.1.3 as "the engine this
      # skill is tested against", and every version-dated claim in
      # the trap topic guides were therefore measured against a release that was
      # no longer the newest. One of them - the arrow family - was then written
      # up as a gap the newest release does not have.
      #
      # A dated status note is only evidence while its premise holds, so the
      # premise is checked here rather than trusted. A newer release is a drift
      # verdict for the ticket; a lookup that fails is a broken check.
      - name: Is the tested engine the newest published release?
        id: engine
        run: |
          set -euo pipefail
          # Read the LOCKFILE, not node_modules: the lockfile is the pin, and
          # an installed artifact is exactly the thing that turned out not to
          # be what it claimed. No `npm ci` step is needed either way.
          installed="$(node -p "require('./package-lock.json').packages['node_modules/@markup-carve/carve'].version")"
          latest="$(npm view @markup-carve/carve version)"
          echo "tested engine: ${installed}; newest published: ${latest}"
          if [ -z "${installed}" ] || [ -z "${latest}" ]; then
            echo "::error::could not read both engine versions"
            exit 1
          fi
          if [ "${installed}" != "${latest}" ]; then
            echo "behind=${installed} -> ${latest}" >> "$GITHUB_OUTPUT"
            echo "::warning::the skill is tested against ${installed} but ${latest} is published; re-measure every version-dated claim in references/ before bumping the pin"
          fi

      # THE GATES ABOVE RUN ON A SCHEDULE AND NOTHING ELSE OBSERVES THEM, so the
      # run files its own verdict. The reporter is markup-carve/carve's
      # changelog-drift one: one issue matched on a body marker, edited by each
      # later run with findings, closed by the first clean one. Scoped to the
      # default branch, because a ticket filed from a deleted branch is never
      # closed. It FAILS if it cannot file.
      - name: File the verdict where someone reads it
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          JOB_STATUS: ${{ job.status }}
          REVIEW_STATUS: ${{ steps.review.outputs.status }}
          ENGINE_BEHIND: ${{ steps.engine.outputs.behind }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Spec drift tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            exit 0
          fi

          broken=false; [ "$JOB_STATUS" = "success" ] || broken=true
          moved=false; [ "${REVIEW_STATUS:-}" = "3" ] && moved=true
          engine=false; [ -n "${ENGINE_BEHIND:-}" ] && engine=true

          MARKER="<!-- spec-drift-verdict ref=$REF_NAME -->"

          # Listed rather than searched: the search index lags a fresh issue by
          # long enough to file a duplicate.
          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          if ! $broken && ! $moved && ! $engine; then
            echo "Spec drift is clean on $HEAD_SHA."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body \
                "Clean again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next run with findings files a fresh ticket rather than reopening this one."
              gh issue close "$issue" --repo "$REPO"
              echo "Closed #$issue."
            fi
            echo "Spec drift clean on \`$HEAD_SHA\`. Nothing filed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "\`Spec drift\` found work that only a person can do. A run that finds only"
            echo "drift stays green, so this ticket is where the verdict shows up."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| trigger | \`$EVENT_NAME\` |"
            echo
            if $broken; then
              echo "### The check itself failed"
              echo
              echo "A step could not do its job: the pin is not on carve main, a checkout or"
              echo "registry lookup failed, or the checker exited with something other than a"
              echo "verdict. The run is RED for that. Open the run and fix the check first;"
              echo "until it runs, anything below may be incomplete."
              echo
            fi
            if $moved; then
              changed="$(sed -n 's/^\(.*\): [0-9]* [a-z]*(s) moved since the skill was last read against them:$/\1/p' /tmp/spec-review.txt)"
              echo "### Read the skill against the changed spec documents"
              echo
              echo "These watched documents changed at carve main since the skill was last"
              echo "read against them:"
              echo
              printf '%s\n' "$changed" | while IFS= read -r doc; do echo "- \`$doc\`"; done
              echo
              echo "No script can decide whether the skill still teaches the right rule, so"
              echo "this part is a reading task:"
              echo
              echo "1. Bump the \`spec\` pin. carve's bump-downstream workflow keeps an"
              echo "   \`automation/bump-spec\` pull request open for this; build on it."
              echo "2. Run \`npm run spec:check\` at the new pin and read every entry it names"
              echo "   in the documents above."
              echo "3. Check each reference page and trap topic guide that teaches that rule,"
              echo "   and correct whatever now teaches the old one."
              echo "4. Only then record the review with \`npm run spec:review\`. Recording"
              echo "   without reading is how carve#455 and the \`image\` node rule landed unread."
              echo
              echo "<details><summary>What the checker reported</summary>"
              echo
              echo '```text'
              cat /tmp/spec-review.txt
              echo '```'
              echo
              echo "</details>"
              echo
            fi
            if $engine; then
              echo "### The tested engine is behind the newest release"
              echo
              echo "\`@markup-carve/carve\` $ENGINE_BEHIND. Bump it with \`npm install\`, then"
              echo "re-measure every version-dated claim in \`references/\`: a dated status"
              echo "note is only evidence while its premise holds."
              echo
            fi
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later run with findings and CLOSED by the first clean one. Closing it by"
            echo "hand does not silence it: the next run with findings files a new one."
          } > /tmp/spec-drift-verdict.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/spec-drift-verdict.md
            echo "Updated #$issue." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --repo "$REPO" \
              --title "The skill has not been read against the spec it pins" \
              --label chore --label area:docs \
              --body-file /tmp/spec-drift-verdict.md)"
            echo "Filed $url." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
